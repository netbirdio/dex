name: Module path
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  module-path:
    runs-on: ubuntu-latest
    env:
      OLD_PATH: github.com/dexidp/dex
      NEW_PATH: github.com/netbirdio/dex
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Module lines use the NetBird path
        run: |
          grep -qx "module ${NEW_PATH}" go.mod || { echo "go.mod must declare 'module ${NEW_PATH}'"; exit 1; }
          grep -qx "module ${NEW_PATH}/api/v2" api/v2/go.mod || { echo "api/v2/go.mod must declare 'module ${NEW_PATH}/api/v2'"; exit 1; }

      - name: No import of the upstream path
        run: |
          # A leftover import still compiles because Go fetches the upstream
          # module as a dependency, so a merge from upstream can bring one back.
          # Source files are matched on the quoted import path so upstream issue
          # links in comments are left alone.
          status=0
          grep -rIn --include='*.go' --include='*.proto' --exclude-dir=.git -e "\"${OLD_PATH}" . && status=1
          grep -rIn --include='go.mod' --exclude-dir=.git -e "${OLD_PATH}" . && status=1
          [ "${status}" -eq 0 ] || { echo "found ${OLD_PATH}: rewrite it to ${NEW_PATH}"; exit 1; }
